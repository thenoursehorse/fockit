[project]
name = "fockit"
dynamic = ["version"]
description = "Build many-body models, write your own operator algebras, and test algorithms on them"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["quantum", "many-body", "operator", "algebra", "fermions", "bosons", "spins"]
authors = [
  {name = "Henry L. Nourse"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/thenoursehorse/fockit"

[project.optional-dependencies]
sympy = [
  "sympy>=1.12",
]
solve = [
  "numpy>=1.26",
  "scipy>=1.11.4",
]

[build-system]
# hatchling 1.32 writes metadata 2.5, which twine doesn't accept yet
requires = ["hatchling<1.32", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/fockit/_version.py"
build.targets.sdist.include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
metadata.allow-direct-references = true

[dependency-groups]
test = [
  "pytest>=8.3",
  "pytest-subtests>=0.14",
  "pytest-cov>=6.0",
]
dev = [
  { include-group = "test" },
  "pre-commit>=4.0",
  "ruff>=0.8.0",
  "mypy>=1.13",
]
all = [
  {include-group = "test"},
  {include-group = "dev"},
]

[tool.pytest]
minversion = "8.3"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = [
  "tests",
]

[tool.ruff]
src = ["src"]
target-version = "py314"
line-length = 88
extend-exclude = ["src/fockit/_version.py"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "E",           # pycodestyle errors
  "F",           # pyflakes (bugs)
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "TID251",      # flake8-tidy-imports.banned-api
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "D",           # pydocstyle
  "D204",        # one-blank-line-after-class
  "D301",        # escape-sequence-in-docstring
  "D413",        # blank-line-after-last-section
  "UP",          # pyupgrade (modern Python)
]
ignore = [
  "PLR",    # Design related pylint codes
  "PLC0415", # allow lazy imports (not at top of file)
  "RUF012", # Would require a lot of ClassVar's
  "D417",  # remove documentation requirement for all functions
]
allowed-confusables = ["σ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 75
max-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = "src"
python_version = "3.14"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sympy.*", "triqs.*"]
ignore_missing_imports = true
