[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operator-algebra"
version = "0.1.0"
description = "Symbolic operator algebra for fermions, bosons, and beyond"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
sympy = ["sympy"]
test = ["pytest"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
