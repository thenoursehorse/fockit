[project]
name = "fockit"
dynamic = ["version"]
description = "Build many-body models, write your own operator algebras, and test algorithms on them"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["quantum", "many-body", "operator", "algebra", "fermions", "bosons", "spins"]
authors = [
  {name = "Henry L. Nourse"},
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/thenoursehorse/fockit"

[project.optional-dependencies]
sympy = [
  "sympy>=1.12",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch]
version.source = "vcs"
version.fallback-version = "0.0.0"
build.targets.sdist.include = ["/src", "/tests", "/examples"]

[dependency-groups]
test = [
  "pytest>=9.0",
]
dev = [
  {include-group = "test"},
  "mypy",
  "pre-commit",
  "ruff",
  "scipy-stubs",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = [
  "tests",
]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.format]
exclude = ["*.md"]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
  "B",           # flake8-bugbear
  "I",           # isort
  "E",           # pycodestyle errors
  "F",           # pyflakes (bugs)
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "PTH",         # flake8-use-pathlib
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "TID251",      # flake8-tidy-imports.banned-api
  "T20",         # flake8-print
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "D",           # pydocstyle
  "D204",        # one-blank-line-after-class
  "D301",        # escape-sequence-in-docstring
  "D413",        # blank-line-after-last-section
  "UP",          # pyupgrade (modern Python)
]
ignore = [
  "PLR",    # Design related pylint codes
  "PLC0415", # allow lazy imports (not at top of file)
  "RUF012", # Would require a lot of ClassVar's
  "D417",  # remove documentation requirement for all functions
]
allowed-confusables = ["σ"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D", "T201", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 75
max-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["src", "tests", "examples"]
python_version = "3.14"
strict = true
show_error_codes = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
  "explicit-override",
  "possibly-undefined",
]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sympy.*", "triqs.*"]
ignore_missing_imports = true
